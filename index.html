<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>What's For Dinner kholoud</title>

    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
          <div class="logo-circle">
            <i class="fa-solid fa-utensils"></i>
          </div>

          <div>
            <h4 class="m-0 fw-bold">What's For Dinner</h4>
            <small class="text-muted">Your daily meal inspiration</small>
          </div>
        </div>

        <div class="nav-icons d-flex align-items-center gap-3">
          <i class="fa-regular fa-bookmark"></i>
          <i class="fa-solid fa-rotate-left"></i>
          <i class="fa-solid fa-gear"></i>
          <img src="./images/avatar-4 (2).jpg" class="profile-img" />
        </div>
      </div>
    </nav>

    <!-- MAIN SECTION -->
    <section class="container py-5">
      <div class="row recipe-card g-0">
        <!-- LEFT -->
        <div class="col-lg-5">
          <div class="image-box">
            <img id="mealImage" class="meal-image" />

            <!-- ⭐ rating (UPDATED) -->
            <div class="rating-box">
              ⭐ <span id="mealRating"></span> (<span id="mealReviews"></span>
              reviews)
            </div>

            <div class="time-box">
              <div class="info-item">
                <i class="fa-regular fa-clock"></i>
                <p>Prep Time</p>
                <span id="prepTime"></span>
              </div>

              <div class="info-item">
                <i class="fa-solid fa-fire"></i>
                <p>Cook Time</p>
                <span id="cookTime"></span>
              </div>

              <div class="info-item">
                <i class="fa-solid fa-users"></i>
                <p>Servings</p>
                <span id="servings"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="col-lg-7">
          <div class="content-box">
            <!-- ⭐ badges (UPDATED) -->
            <div class="d-flex gap-2 mb-3">
              <span
                id="mealDifficulty"
                class="badge bg-success-subtle text-success"
              ></span>
              <span
                id="mealCuisine"
                class="badge bg-primary-subtle text-primary"
              ></span>
            </div>

            <div class="title-row">
              <h1 id="mealName"></h1>

              <div class="top-buttons">
                <button class="top-btn">
                  <i class="fa-regular fa-bookmark"></i>
                </button>
                <button class="top-btn">
                  <i class="fa-solid fa-share-nodes"></i>
                </button>
              </div>
            </div>

            <p id="mealDesc"></p>
            <!-- WARNING MESSAGE -->

            <div id="warningBox" class="warning-box">
              <div class="warning-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
              </div>

              <div>
                <h5>Extended Preparation Time</h5>

                <p id="warningText">
                  This recipe requires more than 45 minutes to prepare. Plan
                  accordingly!
                </p>
              </div>
            </div>
            <!-- TABS -->
            <div class="tabs">
              <button class="tab active" onclick="showTab('ingredients', this)">
                <i class="fa-solid fa-list"></i> Ingredients
              </button>

              <button class="tab" onclick="showTab('instructions', this)">
                <i class="fa-solid fa-book-open"></i> Instructions
              </button>

              <button class="tab" onclick="showTab('nutrition', this)">
                <i class="fa-solid fa-chart-pie"></i> Nutrition
              </button>

              <button class="tab" onclick="showTab('tips', this)">
                <i class="fa-solid fa-lightbulb"></i> Tips
              </button>
            </div>

            <!-- CONTENT -->
            <div class="ingredients-box">
              <ul id="ingredientsList"></ul>
            </div>

            <hr />

            <button id="randomBtn" class="recipe-btn mt-4">
              <i class="fa-solid fa-rotate"></i> Try Another Recipe
            </button>
          </div>
        </div>
      </div>
    </section>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
